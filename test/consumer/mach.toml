[project]
id = "glfw-consumer"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os = "linux"
abi = "sysv64"

[target.windows]
isa = "x86_64"
os = "windows"
abi = "win64"

[target.darwin]
isa = "x86_64"
os = "darwin"
abi = "sysv64"

[profile.debug]
opt = 0
debug = true
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[artifact.glfw-consumer]
kind = "bin"
entry = "main.mach"
out = "bin/glfw-consumer"
targets = ["*"]
link = []
need = []

[dep.glfw]
path = "../.."
