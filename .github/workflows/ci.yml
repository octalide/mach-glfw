name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

env:
  MACH_REF: 91ea708fbd1623bccf17aa41b9f50fb7519e8e71
  ZIG_VERSION: "0.16.0"

jobs:
  linux:
    name: Linux static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build and runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y llvm xauth xorg-dev xvfb libwayland-bin libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Build current Mach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mach-release" "$RUNNER_TEMP/bin"
          gh release download -R briar-systems/mach \
            -p 'mach-*-x86_64-linux.tar.gz' -D "$RUNNER_TEMP/mach-release" --clobber
          tar -xzf "$RUNNER_TEMP"/mach-release/mach-*-x86_64-linux.tar.gz -C "$RUNNER_TEMP/mach-release"
          install -m 0755 "$RUNNER_TEMP/mach-release/mach" "$RUNNER_TEMP/bootstrap-mach"
          git init "$RUNNER_TEMP/mach-src"
          git -C "$RUNNER_TEMP/mach-src" remote add origin https://github.com/briar-systems/mach.git
          git -C "$RUNNER_TEMP/mach-src" fetch --depth 1 origin "$MACH_REF"
          git -C "$RUNNER_TEMP/mach-src" checkout --detach FETCH_HEAD
          cd "$RUNNER_TEMP/mach-src"
          "$RUNNER_TEMP/bootstrap-mach" dep pull
          "$RUNNER_TEMP/bootstrap-mach" build . --profile release
          install -m 0755 out/linux-x86_64/release/bin/mach "$RUNNER_TEMP/bin/mach"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build and test vendored GLFW
        run: |
          set -euo pipefail
          mach dep pull
          tools/surface.sh check
          mach build . --target linux-x86_64 --profile debug
          mach build . --target linux-x86_64 --profile release
          mach test . --target linux-x86_64 --profile debug
          mach test . --target linux-x86_64 --profile release

      - name: Verify self-contained runtime
        run: |
          set -euo pipefail
          for profile in debug release; do
            exe="out/linux-x86_64/$profile/bin/glfw"
            archive="out/linux-x86_64/$profile/vendor/glfw/libglfw.a"
            ldd "$exe" > "$RUNNER_TEMP/glfw-$profile.ldd"
            if grep -qi glfw "$RUNNER_TEMP/glfw-$profile.ldd"; then
              echo "::error::$exe retains a dynamic GLFW dependency"
              exit 1
            fi
            llvm-nm --defined-only "$archive" > "$RUNNER_TEMP/glfw-$profile.nm"
            grep -q ' T glfwInit$' "$RUNNER_TEMP/glfw-$profile.nm"
            xvfb-run -a "$exe" --smoke | tee "$RUNNER_TEMP/glfw-$profile.log"
            grep -q '^GLFW 3\.4\.0$' "$RUNNER_TEMP/glfw-$profile.log"
            grep -q '^smoke ok$' "$RUNNER_TEMP/glfw-$profile.log"
          done

      - name: Verify exported consumer link
        run: |
          set -euo pipefail
          cd test/consumer
          mach dep pull
          mach build . --target linux-x86_64 --profile debug
          mach build . --target linux-x86_64 --profile release
          for profile in debug release; do
            exe="out/linux-x86_64/$profile/bin/glfw-consumer"
            ldd "$exe" > "$RUNNER_TEMP/glfw-consumer-$profile.ldd"
            if grep -qi glfw "$RUNNER_TEMP/glfw-consumer-$profile.ldd"; then
              echo "::error::$exe retains a dynamic GLFW dependency"
              exit 1
            fi
            xvfb-run -a "$exe" | tee "$RUNNER_TEMP/glfw-consumer-$profile.log"
            grep -q '^consumer smoke ok$' "$RUNNER_TEMP/glfw-consumer-$profile.log"
          done

  windows:
    name: Windows static cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install LLVM and Zig
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y llvm xz-utils
          curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Build current Mach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mach-release" "$RUNNER_TEMP/bin"
          gh release download -R briar-systems/mach \
            -p 'mach-*-x86_64-linux.tar.gz' -D "$RUNNER_TEMP/mach-release" --clobber
          tar -xzf "$RUNNER_TEMP"/mach-release/mach-*-x86_64-linux.tar.gz -C "$RUNNER_TEMP/mach-release"
          install -m 0755 "$RUNNER_TEMP/mach-release/mach" "$RUNNER_TEMP/bootstrap-mach"
          git init "$RUNNER_TEMP/mach-src"
          git -C "$RUNNER_TEMP/mach-src" remote add origin https://github.com/briar-systems/mach.git
          git -C "$RUNNER_TEMP/mach-src" fetch --depth 1 origin "$MACH_REF"
          git -C "$RUNNER_TEMP/mach-src" checkout --detach FETCH_HEAD
          cd "$RUNNER_TEMP/mach-src"
          "$RUNNER_TEMP/bootstrap-mach" dep pull
          "$RUNNER_TEMP/bootstrap-mach" build . --profile release
          install -m 0755 out/linux-x86_64/release/bin/mach "$RUNNER_TEMP/bin/mach"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build and inspect vendored GLFW
        run: |
          set -euo pipefail
          mach dep pull
          mach build . --target windows --profile debug
          mach build . --target windows --profile release
          tools/check-windows-pe.sh \
            out/windows/debug/bin/glfw \
            out/windows/release/bin/glfw
          for profile in debug release; do
            llvm-nm --defined-only "out/windows/$profile/vendor/glfw/libglfw.a" \
              > "$RUNNER_TEMP/glfw-$profile.nm"
            grep -q ' T glfwInit$' "$RUNNER_TEMP/glfw-$profile.nm"
          done

      - name: Verify exported consumer link
        run: |
          set -euo pipefail
          cd test/consumer
          mach dep pull
          mach build . --target windows --profile debug
          mach build . --target windows --profile release
          ../../tools/check-windows-pe.sh \
            out/windows/debug/bin/glfw-consumer \
            out/windows/release/bin/glfw-consumer

  windows-native:
    name: Windows native runtime
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = Join-Path $env:RUNNER_TEMP 'zig.zip'
          $root = Join-Path $env:RUNNER_TEMP 'zig'
          curl.exe -fsSL "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip" -o $archive
          Expand-Archive -Path $archive -DestinationPath $root -Force
          $zig = Get-ChildItem -Path $root -Directory | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $zig.FullName

      - name: Build current Mach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $seed = Join-Path $env:RUNNER_TEMP 'mach-release'
          $src = Join-Path $env:RUNNER_TEMP 'mach-src'
          $bin = Join-Path $env:RUNNER_TEMP 'bin'
          New-Item -ItemType Directory -Path $seed, $src, $bin -Force | Out-Null
          gh release download -R briar-systems/mach -p 'mach-*-x86_64-windows.zip' -D $seed --clobber
          $zip = Get-ChildItem -Path $seed -Filter 'mach-*-x86_64-windows.zip' | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath $seed -Force
          $bootstrap = Get-ChildItem -Path $seed -Filter 'mach.exe' -Recurse | Select-Object -First 1
          git -C $src init
          git -C $src remote add origin https://github.com/briar-systems/mach.git
          git -C $src fetch --depth 1 origin $env:MACH_REF
          git -C $src checkout --detach FETCH_HEAD
          Push-Location $src
          & $bootstrap.FullName dep pull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bootstrap.FullName build . --profile release -o current-mach.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item current-mach.exe (Join-Path $bin 'mach.exe') -Force
          Pop-Location
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: Build and run vendored static GLFW
        shell: bash
        run: |
          set -euo pipefail
          mach.exe dep pull
          mach.exe build . --target windows --profile debug
          mach.exe build . --target windows --profile release
          for profile in debug release; do
            exe="out/windows/$profile/bin/glfw"
            "$exe" --smoke | tee "$RUNNER_TEMP/glfw-native-$profile.log"
            grep -q '^GLFW 3\.4\.0$' "$RUNNER_TEMP/glfw-native-$profile.log"
            grep -q '^smoke ok$' "$RUNNER_TEMP/glfw-native-$profile.log"
          done

  darwin:
    name: Darwin x86_64 static and dynamic
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - name: Build current Mach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mach-release" "$RUNNER_TEMP/bin"
          gh release download -R briar-systems/mach \
            -p 'mach-*-x86_64-darwin.tar.gz' -D "$RUNNER_TEMP/mach-release" --clobber
          tar -xzf "$RUNNER_TEMP"/mach-release/mach-*-x86_64-darwin.tar.gz -C "$RUNNER_TEMP/mach-release"
          install -m 0755 "$RUNNER_TEMP/mach-release/mach" "$RUNNER_TEMP/bootstrap-mach"
          git init "$RUNNER_TEMP/mach-src"
          git -C "$RUNNER_TEMP/mach-src" remote add origin https://github.com/briar-systems/mach.git
          git -C "$RUNNER_TEMP/mach-src" fetch --depth 1 origin "$MACH_REF"
          git -C "$RUNNER_TEMP/mach-src" checkout --detach FETCH_HEAD
          cd "$RUNNER_TEMP/mach-src"
          "$RUNNER_TEMP/bootstrap-mach" dep pull
          "$RUNNER_TEMP/bootstrap-mach" build . --profile release
          install -m 0755 out/darwin-x86_64/release/bin/mach "$RUNNER_TEMP/bin/mach"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build and run vendored static GLFW
        run: |
          set -euo pipefail
          if brew list --versions glfw >/dev/null 2>&1; then
            brew uninstall --ignore-dependencies glfw
          fi
          mach dep pull
          if ! mach build . --target darwin --profile debug; then
            nm -u out/darwin/debug/vendor/glfw/libglfw.a || true
            exit 1
          fi
          mach build . --target darwin --profile release
          for profile in debug release; do
            exe="out/darwin/$profile/bin/glfw"
            otool -L "$exe" > "$RUNNER_TEMP/glfw-static-$profile.otool"
            if grep -qi glfw "$RUNNER_TEMP/glfw-static-$profile.otool"; then
              echo "::error::$exe retains a dynamic GLFW dependency"
              exit 1
            fi
            "$exe" --smoke | tee "$RUNNER_TEMP/glfw-static-$profile.log"
            grep -q '^GLFW 3\.4\.0$' "$RUNNER_TEMP/glfw-static-$profile.log"
            grep -q '^smoke ok$' "$RUNNER_TEMP/glfw-static-$profile.log"
          done

      - name: Verify exported consumer link
        run: |
          set -euo pipefail
          cd test/consumer
          mach dep pull
          mach build . --target darwin --profile debug
          mach build . --target darwin --profile release
          for profile in debug release; do
            exe="out/darwin/$profile/bin/glfw-consumer"
            otool -L "$exe" > "$RUNNER_TEMP/glfw-consumer-$profile.otool"
            if grep -qi glfw "$RUNNER_TEMP/glfw-consumer-$profile.otool"; then
              echo "::error::$exe retains a dynamic GLFW dependency"
              exit 1
            fi
            "$exe" | tee "$RUNNER_TEMP/glfw-consumer-$profile.log"
            grep -q '^consumer smoke ok$' "$RUNNER_TEMP/glfw-consumer-$profile.log"
          done

      - name: Build and run system dynamic GLFW
        run: |
          set -euo pipefail
          brew install glfw
          sed -i.bak 's/    "glfw-static",/    "glfw",/' mach.toml
          prefix=$(brew --prefix glfw)
          mach build . --target darwin --profile debug -L "$prefix/lib"
          mach build . --target darwin --profile release -L "$prefix/lib"
          for profile in debug release; do
            exe="out/darwin/$profile/bin/glfw"
            otool -L "$exe" | grep -E 'libglfw(\.3)?\.dylib'
            "$exe" --smoke | tee "$RUNNER_TEMP/glfw-system-$profile.log"
            version=$(sed -n 's/^GLFW //p' "$RUNNER_TEMP/glfw-system-$profile.log")
            major=${version%%.*}
            remainder=${version#*.}
            minor=${remainder%%.*}
            if [[ ! $major =~ ^[0-9]+$ || ! $minor =~ ^[0-9]+$ ]] ||
               (( major < 3 || (major == 3 && minor < 4) )); then
              echo "::error::system GLFW $version is older than 3.4"
              exit 1
            fi
            grep -q '^smoke ok$' "$RUNNER_TEMP/glfw-system-$profile.log"
          done
