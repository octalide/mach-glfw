name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

env:
  MACH_VERSION: v2.4.0
  GLFW_VERSION: "3.4"

jobs:
  full-build:
    name: Full Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch released mach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/machdl
          gh release download "$MACH_VERSION" -R briar-systems/mach \
            -p 'mach-*-x86_64-linux.tar.gz' -D /tmp/machdl --clobber
          tar -xzf /tmp/machdl/mach-*-x86_64-linux.tar.gz -C /tmp/machdl
          install -m 0755 /tmp/machdl/mach /usr/local/bin/mach
          mach info

      - name: Cache GLFW
        id: cache-glfw
        uses: actions/cache@v5
        with:
          path: ~/glfw-install
          key: glfw-${{ env.GLFW_VERSION }}-${{ runner.os }}

      - name: Build GLFW
        if: steps.cache-glfw.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # ubuntu's libglfw3-dev is 3.3; the bindings target 3.4
          sudo apt-get update
          sudo apt-get install -y cmake xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols
          curl -sL "https://github.com/glfw/glfw/archive/refs/tags/$GLFW_VERSION.tar.gz" | tar xz
          cmake -S "glfw-$GLFW_VERSION" -B glfw-build -DBUILD_SHARED_LIBS=ON \
            -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF \
            -DCMAKE_INSTALL_PREFIX="$HOME/glfw-install"
          cmake --build glfw-build --parallel
          cmake --install glfw-build

      - name: Install GLFW
        run: sudo cp -P ~/glfw-install/lib/libglfw.so* /usr/lib/ && sudo ldconfig

      - name: Sync dependencies
        run: mach dep pull

      - name: Build
        run: |
          set -euo pipefail
          mach build .
          test -x out/linux/bin/glfw || { echo "::error::mach build . produced no binary"; exit 1; }

  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch released mach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/machdl
          gh release download "$MACH_VERSION" -R briar-systems/mach \
            -p 'mach-*-x86_64-linux.tar.gz' -D /tmp/machdl --clobber
          tar -xzf /tmp/machdl/mach-*-x86_64-linux.tar.gz -C /tmp/machdl
          install -m 0755 /tmp/machdl/mach /usr/local/bin/mach
          mach info

      - name: Cache GLFW
        id: cache-glfw
        uses: actions/cache@v5
        with:
          path: ~/glfw-install
          key: glfw-${{ env.GLFW_VERSION }}-${{ runner.os }}

      - name: Build GLFW
        if: steps.cache-glfw.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols
          curl -sL "https://github.com/glfw/glfw/archive/refs/tags/$GLFW_VERSION.tar.gz" | tar xz
          cmake -S "glfw-$GLFW_VERSION" -B glfw-build -DBUILD_SHARED_LIBS=ON \
            -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF \
            -DCMAKE_INSTALL_PREFIX="$HOME/glfw-install"
          cmake --build glfw-build --parallel
          cmake --install glfw-build

      - name: Install GLFW
        run: sudo cp -P ~/glfw-install/lib/libglfw.so* /usr/lib/ && sudo ldconfig

      - name: Surface parity
        run: tools/surface.sh check

      - name: Sync dependencies
        run: mach dep pull

      - name: Test
        run: |
          set -euo pipefail
          mach test .
