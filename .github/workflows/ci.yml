name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  full-build:
    name: Full Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch released mach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R octalide/mach -p mach -D /usr/local/bin
          chmod +x /usr/local/bin/mach

      - name: Install GLFW
        run: sudo apt-get update && sudo apt-get install -y libglfw3-dev

      - name: Fetch dependencies
        run: mach dep pull

      - name: Build
        run: |
          set -euo pipefail
          mach build .
          test -x out/linux/bin/glfw || { echo "::error::mach build . produced no binary"; exit 1; }

  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch released mach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R octalide/mach -p mach -D /usr/local/bin
          chmod +x /usr/local/bin/mach

      - name: Install GLFW
        run: sudo apt-get update && sudo apt-get install -y libglfw3-dev

      - name: Fetch dependencies
        run: mach dep pull

      - name: Test
        run: mach test .
