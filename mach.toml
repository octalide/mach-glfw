# the dynamic half of GLFW's C runtime surface. the remaining memcpy, memmove,
# memset, strlen, sprintf, sscanf and vsnprintf need the static mingw CRT.
[link.ucrt-heap]
source = "system"
name = "api-ms-win-crt-heap-l1-1-0.dll"
symbols = ["malloc", "free", "realloc"]
os = ["windows"]
isa = "*"
abi = "*"
export = true

[link.ucrt-string]
source = "system"
name = "api-ms-win-crt-string-l1-1-0.dll"
symbols = [
    "strcmp", "strcpy", "strcspn", "strncmp", "strncpy",
    "strspn", "strtok", "wcscmp", "wcscpy",
]
os = ["windows"]
isa = "*"
abi = "*"
export = true

[link.ucrt-convert]
source = "system"
