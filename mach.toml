[link.libSystem]
source = "system"
name = "/usr/lib/libSystem.B.dylib"
library = "/usr/lib/libSystem.B.dylib"
symbols = [
    "___assert_rtn", "___bzero", "___memcpy_chk", "___sprintf_chk",
    "___stack_chk_fail", "___stack_chk_guard", "__NSConcreteGlobalBlock",
