[step.build-glfw]
cmd = "bash tools/build-glfw.sh {project.out}/vendor/glfw"
in = [
    "tools/build-glfw.sh",
    "vendor/glfw/include/GLFW/*",
    "vendor/glfw/src/*",
    "vendor/glfw/deps/wayland/*",
]
out = ["{project.out}/vendor/glfw/libglfw.a"]
need = []

[step.mingw-runtime]
cmd = "bash tools/materialize-mingw-runtime.sh {project.out}/vendor/mingw/libmingw32.lib {project.out}/vendor/mingw/compiler_rt.lib"
in = ["tools/materialize-mingw-runtime.sh"]
out = [
    "{project.out}/vendor/mingw/libmingw32.lib",
    "{project.out}/vendor/mingw/compiler_rt.lib",
]
need = []

[dep.mach-std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"
