[project]
id      = "glfw"
version = "0.2.0"
module  = "glfw.mach"
target  = "native"
src     = "src"
dep     = "dep"
out     = "out/{target}/bin/{name}{ext}"
obj     = "out/{target}/obj"

[target.linux]
isa  = "x86_64"
os   = "linux"
abi  = "sysv64"

[target.windows]
isa  = "x86_64"
os   = "windows"
abi  = "win64"
ext  = ".exe"
# declared intent: the windows toolchain is not yet validated end-to-end

[target.darwin]
isa  = "x86_64"
os   = "darwin"
abi  = "sysv64"

[os.linux]
libs = ["glfw"]

[os.windows]
libs = ["glfw3.dll"]

[os.darwin]
# declared intent: Mach-O dynamic imports are not yet implemented in mach
libs = ["glfw"]

[bin.glfw]
entry = "main.mach"

[deps.mach-std]
git = "https://github.com/octalide/mach-std"
ref = "branch/main"
