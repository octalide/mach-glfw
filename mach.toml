[project]
id = "glfw"
version = "0.3.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
opt = 0
debug = true
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[artifact.glfw]
kind = "bin"
entry = "main.mach"
out = "bin/glfw"
targets = ["*"]
link = [
    "glfw-static",
    "pthread", "m", "dl", "rt",
    "gdi32", "user32", "shell32", "kernel32",
    "ucrt-heap", "ucrt-string", "ucrt-convert", "ucrt-utility",
    "ucrt-math", "ucrt-private",
    "Cocoa", "IOKit", "CoreFoundation", "CoreVideo", "OpenGL",
]
need = []

[link.glfw-static]
source = "local"
path = "{project.out}/vendor/glfw/libglfw.a"
os = ["linux", "windows", "darwin"]
isa = "*"
abi = "*"
export = true

# opt-in fallback: swap "glfw-static" for "glfw"/"glfw-win" in the artifact's
# link list to build against a system-installed GLFW instead of the vendored one
[link.glfw]
source = "system"
name = "glfw"
os = ["linux", "darwin"]
isa = "*"
abi = "*"
export = true

[link.glfw-win]
source = "system"
name = "glfw3.dll"
os = ["windows"]
isa = "*"
abi = "*"
export = true

# the static archive carries these itself; a system libglfw.so resolved them
# transitively. X11/wayland/GL are dlopen'd at runtime, so they are not linked.
[link.pthread]
source = "system"
name = "pthread"
os = ["linux"]
isa = "*"
abi = "*"
export = true

[link.m]
source = "system"
name = "m"
os = ["linux"]
isa = "*"
abi = "*"
export = true

[link.dl]
source = "system"
name = "dl"
os = ["linux"]
isa = "*"
abi = "*"
export = true

[link.rt]
source = "system"
name = "rt"
os = ["linux"]
isa = "*"
abi = "*"
export = true

# the four DLLs GLFW's win32 backend imports directly
[link.gdi32]
source = "system"
name = "gdi32.dll"
os = ["windows"]
isa = "*"
abi = "*"
export = true

[link.user32]
source = "system"
name = "user32.dll"
os = ["windows"]
isa = "*"
abi = "*"
export = true

[link.shell32]
source = "system"
name = "shell32.dll"
os = ["windows"]
isa = "*"
abi = "*"
export = true

[link.kernel32]
source = "system"
name = "kernel32.dll"
os = ["windows"]
isa = "*"
abi = "*"
export = true

# the dynamic half of GLFW's C runtime surface. the remaining memcpy, memmove,
# memset, strlen, sprintf, sscanf and vsnprintf need the static mingw CRT.
[link.ucrt-heap]
source = "system"
name = "api-ms-win-crt-heap-l1-1-0.dll"
symbols = ["malloc", "free", "realloc"]
os = ["windows"]
isa = "*"
abi = "*"
export = true

[link.ucrt-string]
source = "system"
name = "api-ms-win-crt-string-l1-1-0.dll"
symbols = [
    "strcmp", "strcpy", "strcspn", "strncmp", "strncpy",
    "strspn", "strtok", "wcscmp", "wcscpy",
]
os = ["windows"]
isa = "*"
abi = "*"
export = true

[link.ucrt-convert]
source = "system"
name = "api-ms-win-crt-convert-l1-1-0.dll"
symbols = ["strtol", "strtoul"]
os = ["windows"]
isa = "*"
abi = "*"
export = true

[link.ucrt-utility]
source = "system"
name = "api-ms-win-crt-utility-l1-1-0.dll"
symbols = ["qsort"]
os = ["windows"]
isa = "*"
abi = "*"
export = true

[link.ucrt-math]
source = "system"
name = "api-ms-win-crt-math-l1-1-0.dll"
symbols = ["powf"]
os = ["windows"]
isa = "*"
abi = "*"
export = true

[link.ucrt-private]
source = "system"
name = "api-ms-win-crt-private-l1-1-0.dll"
symbols = ["strstr"]
os = ["windows"]
isa = "*"
abi = "*"
export = true

[link.Cocoa]
source = "framework"
name = "Cocoa"
os = ["darwin"]
isa = "*"
abi = "*"
export = true

[link.CoreFoundation]
source = "framework"
name = "CoreFoundation"
os = ["darwin"]
isa = "*"
abi = "*"
export = true

[link.IOKit]
source = "framework"
name = "IOKit"
os = ["darwin"]
isa = "*"
abi = "*"
export = true

[link.CoreVideo]
source = "framework"
name = "CoreVideo"
os = ["darwin"]
isa = "*"
abi = "*"
export = true

[link.OpenGL]
source = "framework"
name = "OpenGL"
os = ["darwin"]
isa = "*"
abi = "*"
export = true

[step.build-glfw]
cmd = "tools/build-glfw.sh {project.out}/vendor/glfw"
in = [
    "tools/build-glfw.sh",
    "vendor/glfw/include/GLFW/*",
    "vendor/glfw/src/*",
    "vendor/glfw/deps/wayland/*",
]
out = ["{project.out}/vendor/glfw/libglfw.a"]
need = []

[dep.mach-std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"
