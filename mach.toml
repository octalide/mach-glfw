[link.ucrt-utility]
source = "system"
name = "api-ms-win-crt-utility-l1-1-0.dll"
symbols = ["qsort"]
os = ["windows"]
isa = "*"
abi = "*"
export = true

[link.ucrt-math]
source = "system"
name = "api-ms-win-crt-math-l1-1-0.dll"
symbols = ["powf"]
os = ["windows"]
isa = "*"
abi = "*"
export = true

[link.ucrt-private]
source = "system"
name = "api-ms-win-crt-private-l1-1-0.dll"
symbols = ["strstr"]
os = ["windows"]
isa = "*"
abi = "*"
export = true

[link.ucrt-stdio]
source = "system"
name = "api-ms-win-crt-stdio-l1-1-0.dll"
symbols = ["__stdio_common_vsprintf", "__stdio_common_vsscanf"]
os = ["windows"]
isa = "*"
abi = "*"
export = true

[link.libSystem]
source = "system"
name = "/usr/lib/libSystem.B.dylib"
library = "/usr/lib/libSystem.B.dylib"
symbols = [
    "__assert_rtn", "__bzero", "__memcpy_chk", "__sprintf_chk",
    "__stack_chk_fail", "__stack_chk_guard", "_NSConcreteGlobalBlock",
    "_NSGetProgname", "chdir", "dlclose", "dlopen", "dlsym", "fmod",
    "free", "mach_absolute_time", "mach_timebase_info", "malloc",
    "memcpy", "memmove", "memset", "powf", "pthread_getspecific",
    "pthread_key_create", "pthread_key_delete", "pthread_mutex_destroy",
    "pthread_mutex_init", "pthread_mutex_lock", "pthread_mutex_unlock",
    "pthread_setspecific", "qsort", "realloc", "sprintf", "sscanf",
    "strcmp", "strcpy", "strcspn", "strlen", "strncmp", "strncpy",
    "strspn", "strstr", "strtok", "strtol", "strtoul", "usleep",
    "vsnprintf",
]
os = ["darwin"]
isa = "*"
abi = "*"
export = true

[link.objc]
